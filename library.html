<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#161421">
<title>Roots — Cultural Library</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="library" data-back="index.html">
<div id="app">
  <div class="screen active">

    <!-- TOP BAR (shared shell) -->
    <div class="app-topbar">
      <span class="topbar-back" id="topbarBack">‹</span>
      <span class="topbar-title">Library</span>
      <a class="topbar-action" href="index.html#settings">⚙️</a>
    </div>

    <!-- CONTENT -->
    <div class="main-content">
      <div class="view active">
        <div class="lib-topbar">
          <h2 class="lib-topbar-title">📚 Cultural Library</h2>
        </div>
        <div class="library-tabs" id="libraryTabs">
          <button class="lib-tab active" data-libtab="totems">Totems</button>
          <button class="lib-tab" data-libtab="proverbs">Proverbs</button>
          <button class="lib-tab" data-libtab="greetings">Greetings</button>
          <button class="lib-tab" data-libtab="poems">Poems</button>
          <button class="lib-tab" data-libtab="regions">Regions</button>
          <button class="lib-tab" data-libtab="glossary">📖 Glossary</button>
          <button class="lib-tab" data-libtab="shonaRoora">💍 Shona Roora</button>
          <button class="lib-tab" data-libtab="ndebeleRoora">💍 Ndebele Roora</button>
        </div>
        <div id="libraryBody"></div>
      </div>
    </div>

    <!-- BOTTOM NAV (shared shell) -->
    <div class="bottom-nav">
      <div class="nav-item" data-page="timeline" data-href="timeline.html"><img src="assets/icons/clock.svg" alt="Timeline"></div>
      <div class="nav-item" data-page="tree" data-href="tree.html"><img src="assets/icons/tree.svg" alt="Family Tree"></div>
      <div class="nav-item active" data-page="library"><img src="assets/icons/read-book.svg" alt="Library"></div>
      <div class="nav-item" data-page="home" data-href="index.html#profile"><img src="assets/icons/profile-picture.svg" alt="Profile"></div>
    </div>

  </div>

  <div id="toast"></div>
</div>

<script src="data.js"></script>
<script src="lookups.js"></script>
<script src="customary.js"></script>
<script src="shell.js"></script>
<script src="store.js"></script>
<script src="dataset_v2.js"></script>
<script src="dataset.js"></script>
<script src="library.js"></script>
</body>
</html>
