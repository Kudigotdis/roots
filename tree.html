<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#161421">
<title>Roots — Family Tree</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="tree" data-back="index.html">
<div id="app">
  <div class="screen active">

    <!-- TOP BAR (shared shell) -->
    <div class="app-topbar">
      <span class="topbar-back" id="topbarBack">‹</span>
      <span class="topbar-title">Family Tree</span>
      <div id="bloodlineIndicator" style="display:none;font-size:0.65rem;background:var(--lime);color:var(--text);padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap;margin-left:auto;cursor:pointer;"></div>
      <span class="topbar-action" id="settingsBtn">⚙️</span>
    </div>

    <!-- CONTENT : Temporal Cascade Matrix -->
    <div class="main-content">
      <div class="view active">
        <div id="stats-strip">
          <div class="stat-cell"><div class="stat-label">Total People</div><div class="stat-value" id="stat-total">—</div></div>
          <div class="stat-cell"><div class="stat-label">Blood Line</div><div class="stat-value" id="stat-blood">—</div></div>
          <div class="stat-cell"><div class="stat-label">Married In</div><div class="stat-value" id="stat-married">—</div></div>
          <div class="stat-cell"><div class="stat-label">Living</div><div class="stat-value" id="stat-living">—</div></div>
          <div class="stat-cell"><div class="stat-label">Generations</div><div class="stat-value" id="stat-gens">—</div></div>
        </div>
        <div id="search-bar-wrap">
          <input type="text" id="search-input" placeholder="Search by name or surname…">
          <button class="top-text-btn" id="legend-toggle-btn-top">Legend</button>
        </div>
        <div id="main-row">
          <div id="decade-rail"></div>
          <div id="viewport">
            <div id="canvas">
              <svg id="connector-svg"></svg>
            </div>
          </div>
        </div>
        <div id="controls">
          <button id="ego-switch-btn" class="ctrl-btn">View as: You</button>
          <div class="zoom-group">
            <button id="zoom-out" class="ctrl-btn zoom-btn">−</button>
            <button id="zoom-fit" class="ctrl-btn zoom-btn" style="width:auto;padding:0 10px;font-size:10px;">FIT</button>
            <button id="zoom-in" class="ctrl-btn zoom-btn">+</button>
          </div>
        </div>
        <div id="legend-panel">
          <div class="legend-title">Legend</div>
          <div class="legend-group">
            <div class="legend-group-label">Spouse Status</div>
            <div class="legend-row"><div class="legend-swatch" style="border-color:#1C1C1C;background:#fff;"></div>Civil marriage</div>
            <div class="legend-row"><div class="legend-swatch" style="border-color:#3E7D4C;background:#fff;"></div>Customary union (Roora paid)</div>
            <div class="legend-row"><div class="legend-swatch" style="border-color:#9A9A93;border-style:dashed;background:#fff;"></div>Cohabiting / unregistered</div>
            <div class="legend-row"><div class="legend-swatch" style="border-color:#C0392B;border-style:dotted;background:#fff;"></div>Severed / divorced</div>
            <div class="legend-row"><div class="legend-swatch" style="border-color:#C8C8C2;background:#eee;"></div>Deceased</div>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAV (shared shell) -->
    <div class="bottom-nav">
      <div class="nav-item" data-page="timeline" data-href="timeline.html"><img src="assets/icons/clock.svg" alt="Timeline"></div>
      <div class="nav-item active" data-page="tree"><img src="assets/icons/tree.svg" alt="Family Tree"></div>
      <div class="nav-item" data-page="library" data-href="library.html"><img src="assets/icons/read-book.svg" alt="Library"></div>
      <div class="nav-item" data-page="home" data-href="index.html#profile"><img src="assets/icons/profile-picture.svg" alt="Profile"></div>
    </div>

  </div>

  <!-- ============ PROFILE PANEL (tree node overlay) ============ -->
  <div id="profilePanelOverlay"></div>
  <div id="profilePanel">
    <div class="panelHeader">
      <div class="panelTopRow">
        <button class="panelIconBtn" id="panelClose">✕</button>
      </div>
      <div class="panelIdentity">
        <div class="panelThumb" id="panelThumb">
          <div id="panelThumbInner"></div>
          <div class="camBadge">📷</div>
        </div>
        <div>
          <div class="panelName" id="panelName">—</div>
          <div class="panelMeta" id="panelMeta"></div>
        </div>
      </div>
    </div>
    <div class="tabBar">
      <button class="tabBtn active" data-tab="lifestory">Lifestory</button>
      <button class="tabBtn" data-tab="info">Info</button>
      <button class="tabBtn" data-tab="kinship">Kinship</button>
      <button class="tabBtn" data-tab="family">Family</button>
      <button class="tabBtn" data-tab="gallery">Gallery</button>
    </div>
    <div class="panelContent">
      <div class="tabPane active" id="pane-lifestory"></div>
      <div class="tabPane" id="pane-info"></div>
      <div class="tabPane" id="pane-kinship"></div>
      <div class="tabPane" id="pane-family"></div>
      <div class="tabPane" id="pane-gallery"></div>
    </div>
  </div>

  <!-- ============ TCM3 PROFILE OVERLAY ============ -->
  <div id="overlay-backdrop">
    <div class="profile-modal" id="profile-modal-content"></div>
  </div>

  <!-- ============ TCM3 EGO PICKER ============ -->
  <div id="ego-picker-backdrop">
    <div class="ego-picker-modal">
      <div class="ego-picker-title">View tree as —</div>
      <div id="ego-picker-list"></div>
    </div>
  </div>

  <!-- ============ TCM3 SELECTION MODAL ============ -->
  <div id="select-modal-backdrop">
    <div class="select-modal">
      <div class="select-modal-title" id="select-modal-title">Select</div>
      <input type="text" class="select-modal-search" id="select-modal-search" placeholder="Filter…">
      <div class="select-modal-list" id="select-modal-list"></div>
    </div>
  </div>

  <!-- ============ DEATH & SUCCESSION PANEL ============ -->
  <div class="panel-overlay" id="deathOverlay">
    <div class="settings-panel" id="deathPanel" style="max-height:92vh;">
      <div class="panel-handle"></div>
      <div class="settings-title" id="deathTitle">⚰️ Death & Succession</div>
      <div class="library-tabs" id="deathTabs">
        <button class="lib-tab active" data-deathtab="funeral">🕯️ Funeral</button>
        <button class="lib-tab" data-deathtab="ritual">🙏 Ritual</button>
        <button class="lib-tab" data-deathtab="estate">🏠 Estate</button>
      </div>
      <div id="deathBody" style="flex:1;overflow-y:auto;margin-top:10px;"></div>
      <button class="btn-done" id="deathDone">Done</button>
    </div>
  </div>

  <!-- ============ MARRIAGE (ROORA) PANEL ============ -->
  <div class="panel-overlay" id="marriageOverlay">
    <div class="settings-panel" id="marriagePanel" style="max-height:92vh;">
      <div class="panel-handle"></div>
      <div class="settings-title" id="marriageTitle">💍 Roora / Lobola</div>
      <div id="marriageBody" style="flex:1;overflow-y:auto;margin-top:10px;"></div>
      <button class="btn-done" id="marriageDone">Done</button>
    </div>
  </div>

  <!-- ============ MODAL ============ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet" id="modalSheet">
      <div class="panel-handle"></div>
      <div class="modal-title" id="modalTitle">Select</div>
      <div id="modalBody"></div>
      <button class="modal-btn secondary" id="modalCancel">Cancel</button>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div id="toast"></div>
</div>

<script src="data.js"></script>
<script src="lookups.js"></script>
<script src="customary.js"></script>
<script src="shell.js"></script>
<script src="store.js"></script>
<script src="dataset_v2.js"></script>
<script src="dataset.js"></script>
<script src="settings.js"></script>
<script src="tree.js"></script>
</body>
</html>
