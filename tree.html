<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Temporal Cascade Matrix — Roots Engine v2</title>
    <style>
        :root {
            --bg: #EDEDE9;
            --rail: #D9D9D3;
            --rail-line: #B9B9B2;
            --card-bg: #FFFFFF;
            --ink: #1C1C1C;
            --ink-soft: #6B6B65;
            --male: #2F6FED;
            --female: #E0567C;
            --dead-dark: #6E6E68;
            --dead-light: #C8C8C2;
            --line-neutral: #B8B8B0;
            --status-civil: #1C1C1C;
            --status-customary: #3E7D4C;
            --status-cohabit: #9A9A93;
            --status-severed: #C0392B;
            --branch-a: #2F6FED;
            --branch-b: #C0392B;
            --branch-c: #3E7D4C;
            --branch-d: #B5892A;
            --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            --card-w: 148px;
            --card-h: 205px;
            --col-w: 178px;
            --row-h: 195px;
            --buffer: 30px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            font-family: var(--sans);
            color: var(--ink);
            overflow: hidden;
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- STATS STRIP ---------- */
        #stats-strip {
            display: flex;
            background: var(--ink);
            color: #F4F4F1;
            z-index: 30;
            flex-shrink: 0;
        }
        .stat-cell {
            flex: 1;
            padding: 8px 12px;
            border-right: 1px solid rgba(255, 255, 255, 0.12);
            font-family: var(--mono);
            text-align: center;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .stat-cell:last-child {
            border-right: none;
        }
        .stat-cell:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .stat-label {
            font-size: 8.5px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #A8A89E;
        }
        .stat-value {
            font-size: 16px;
            font-weight: 700;
            margin-top: 2px;
        }

        /* ---------- MAIN ROW (viewport + rail) ---------- */
        #main-row {
            position: relative;
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* ---------- SEARCH BAR (moved below main-row via flex order) ---------- */
        #search-bar-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            border-top: 1px solid var(--rail-line);
            border-bottom: 1px solid var(--rail-line);
            padding: 8px 14px;
            z-index: 29;
            flex-shrink: 0;
            order: 2;
        }
        #search-input {
            flex: 1;
            font-family: var(--mono);
            font-size: 13px;
            border: 1px solid var(--rail-line);
            border-radius: 8px;
            padding: 8px 12px;
            background: var(--bg);
            color: var(--ink);
            outline: none;
        }
        #search-input:focus {
            border-color: var(--ink);
        }
        .top-text-btn {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: var(--bg);
            border: 1px solid var(--rail-line);
            border-radius: 8px;
            padding: 8px 11px;
            cursor: pointer;
            color: var(--ink);
            white-space: nowrap;
        }
        .top-text-btn:hover {
            background: #E2E2DC;
        }

        /* ---------- DECADE RAIL ---------- */
        #decade-rail {
            position: relative;
            width: 78px;
            min-width: 78px;
            background: var(--rail);
            border-right: 1px solid var(--rail-line);
            z-index: 5;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            display: flex;
            flex-direction: column;
        }
        .decade-tick {
            position: absolute;
            left: 0;
            right: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 6px;
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.06em;
            color: var(--ink-soft);
            border-top: 1px dashed var(--rail-line);
        }
        .decade-tick span {
            /* horizontal text — removed writing-mode */
            display: inline-block;
            font-size: 10.5px;
        }
        .decade-tick.blank {
            color: #BEBEB6;
        }

        /* Rail toggle button pinned at bottom */
        #rail-toggle-wrap {
            margin-top: auto;
            padding: 8px 0 12px 0;
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--rail-line);
            background: var(--rail);
            position: sticky;
            bottom: 0;
            z-index: 6;
        }
        #rail-toggle-btn {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: var(--ink);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
        }
        #rail-toggle-btn:hover {
            background: #333;
        }

        /* ---------- VIEWPORT ---------- */
        #viewport {
            position: relative;
            flex: 1;
            overflow: auto;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0;
        }
        #canvas {
            position: relative;
            transform-origin: top left;
            transition: transform 0.25s ease;
        }
        #connector-svg {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: visible;
            z-index: 1;
        }
        .conn-line {
            stroke: var(--line-neutral);
            stroke-width: 2.5;
            fill: none;
            transition: d 0.3s ease, opacity 0.25s ease;
        }
        .conn-line.spouse {
            stroke-width: 3;
            stroke-dasharray: 6 4;
        }
        .conn-line.dimmed {
            opacity: 0.15;
        }

        /* ---------- PERSON NODE ---------- */
        .person-node {
            position: absolute;
            width: var(--card-w);
            z-index: 3;
            transition: left 0.35s ease, top 0.35s ease, opacity 0.3s ease;
        }
        .person-node.hidden-node {
            opacity: 0;
            pointer-events: none;
        }
        .person-node.search-dim .card {
            opacity: 0.18;
        }
        .person-node.search-match .card {
            box-shadow: 0 0 0 3px var(--ink), 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.06);
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .zone-image {
            padding: 10px 10px 0;
            cursor: pointer;
        }
        .zone-image:active .thumb {
            transform: scale(0.97);
        }

        .thumb {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            background: #F4F4F1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border-width: 3px;
            border-style: solid;
            transition: transform 0.1s ease;
        }
        .thumb.gender-m {
            border-color: rgba(47, 111, 237, 0.18);
        }
        .thumb.gender-f {
            border-color: rgba(224, 86, 124, 0.18);
        }
        .thumb.status-civil {
            border-color: var(--status-civil);
            border-style: solid;
        }
        .thumb.status-customary {
            border-color: var(--status-customary);
            border-style: solid;
        }
        .thumb.status-cohabit {
            border-color: var(--status-cohabit);
            border-style: dashed;
        }
        .thumb.status-severed {
            border-color: var(--status-severed);
            border-style: dotted;
        }
        .thumb.deceased {
            filter: grayscale(1);
            border-color: var(--dead-light) !important;
            border-style: solid !important;
        }
        .thumb.deceased::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.35);
        }

        .silhouette {
            width: 78%;
            height: 92%;
            fill: #B9B9C7;
            display: block;
            position: relative;
            z-index: 0;
        }
        .thumb.gender-f .silhouette {
            fill: #D9AFC0;
        }
        .thumb.deceased .silhouette {
            fill: var(--dead-light);
        }

        .severed-tag {
            position: absolute;
            top: 4px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--mono);
            font-size: 8px;
            letter-spacing: 0.06em;
            font-weight: 700;
            color: #fff;
            background: var(--status-severed);
            padding: 2px 0;
            z-index: 2;
        }
        .deceased-tag {
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--mono);
            font-size: 8px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--dead-dark);
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 0;
            z-index: 2;
        }

        .zone-text {
            padding: 7px 8px 9px;
            cursor: pointer;
            border-top: 1px dashed rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .zone-text:hover {
            background: rgba(0, 0, 0, 0.02);
        }
        .name-row {
            font-size: 11.5px;
            font-weight: 700;
            line-height: 1.2;
        }
        .surname-row {
            font-size: 10px;
            font-weight: 500;
            color: var(--ink-soft);
            line-height: 1.15;
        }
        .year-row {
            margin-top: 3px;
            font-family: var(--mono);
            font-size: 9.5px;
            color: var(--ink-soft);
        }
        .tap-hint {
            margin-top: 3px;
            font-family: var(--mono);
            font-size: 8px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #B0B0A8;
        }

        .ego-badge {
            position: absolute;
            top: -8px;
            left: -8px;
            background: var(--ink);
            color: #fff;
            font-family: var(--mono);
            font-size: 8px;
            letter-spacing: 0.06em;
            padding: 2px 6px;
            border-radius: 6px;
            text-transform: uppercase;
            z-index: 4;
        }

        /* ---------- POPOVER ---------- */
        .popover {
            position: absolute;
            z-index: 20;
            width: 240px;
            background: var(--ink);
            color: #F4F4F1;
            border-radius: 12px;
            padding: 14px 16px;
            font-family: var(--sans);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
            animation: pop-in 0.15s ease;
        }
        @keyframes pop-in {
            from {
                opacity: 0;
                transform: translateY(4px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .popover .p-name {
            font-size: 15px;
            font-weight: 700;
        }
        .popover .p-years {
            font-family: var(--mono);
            font-size: 10.5px;
            color: #C7C7C0;
            margin-top: 2px;
        }
        .pop-field {
            margin-top: 8px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: var(--mono);
            color: #9E9E96;
        }
        .pop-field b {
            display: block;
            font-family: var(--sans);
            text-transform: none;
            letter-spacing: 0;
            font-size: 12.5px;
            color: #fff;
            margin-top: 1px;
            font-weight: 600;
        }
        .popover .p-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
        .popover button {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            border-radius: 7px;
            padding: 6px 9px;
            cursor: pointer;
            flex: 1;
        }
        .popover button:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .popover button.primary {
            background: #fff;
            color: var(--ink);
            border-color: #fff;
        }
        .popover button.primary:hover {
            background: #E9E9E4;
        }

        /* ---------- PROFILE OVERLAY ---------- */
        #overlay-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(20, 20, 18, 0.55);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #overlay-backdrop.open {
            display: flex;
        }

        .profile-modal {
            width: 560px;
            max-width: 94vw;
            max-height: 88vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 18px;
            padding: 26px;
            position: relative;
        }
        .profile-close {
            position: absolute;
            top: 16px;
            right: 16px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--ink-soft);
            cursor: pointer;
            background: var(--bg);
            border-radius: 8px;
            padding: 5px 9px;
            z-index: 2;
        }
        .profile-close:hover {
            color: var(--ink);
        }

        .profile-thumb-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 4px;
        }
        .profile-thumb {
            width: 128px;
            height: 128px;
            border-radius: 16px;
            background: #F4F4F1;
            border-width: 4px;
            border-style: solid;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .profile-thumb .silhouette {
            width: 80%;
            height: 94%;
        }

        .change-img-btn {
            margin-top: 10px;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: var(--bg);
            border: 1px solid var(--rail-line);
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
            color: var(--ink);
        }
        .change-img-btn:hover {
            background: #E2E2DC;
        }
        #hidden-file-input {
            display: none;
        }

        .profile-name {
            text-align: center;
            font-size: 19px;
            font-weight: 700;
            margin-top: 14px;
        }
        .profile-years {
            text-align: center;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 3px;
        }
        .profile-flags {
            text-align: center;
            margin-top: 6px;
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .flag-chip {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 7px;
            border-radius: 6px;
            background: var(--bg);
            color: var(--ink-soft);
        }
        .flag-chip.deceased {
            background: var(--dead-light);
            color: #fff;
        }
        .flag-chip.severed {
            background: var(--status-severed);
            color: #fff;
        }
        .flag-chip.ego {
            background: var(--ink);
            color: #fff;
        }

        .edit-toggle-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
        }
        .edit-toggle-row button {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            border: 1px solid var(--rail-line);
            background: #fff;
            color: var(--ink);
        }
        .edit-toggle-row button.active {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
        }

        .profile-section {
            margin-top: 18px;
            border-top: 1px solid var(--bg);
            padding-top: 12px;
        }
        .profile-section-label {
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 8px;
        }
        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 10px;
        }
        .field-grid.single {
            grid-template-columns: 1fr;
        }
        .field-grid.three {
            grid-template-columns: 1fr 1fr 1fr;
        }
        .field-item {
            font-size: 12.5px;
        }
        .field-item-label {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #A8A8A0;
            margin-bottom: 2px;
        }
        .field-item-value {
            font-weight: 500;
            color: var(--ink);
        }
        .field-item-value.empty {
            color: #B8B8B0;
            font-style: italic;
            font-weight: 400;
        }

        .field-edit-input {
            width: 100%;
            font-family: var(--sans);
            font-size: 12.5px;
            border: 1px solid var(--rail-line);
            border-radius: 6px;
            padding: 6px 8px;
            background: var(--bg);
            color: var(--ink);
        }
        .field-select-btn {
            width: 100%;
            text-align: left;
            font-family: var(--sans);
            font-size: 12.5px;
            border: 1px solid var(--rail-line);
            border-radius: 6px;
            padding: 6px 8px;
            background: #fff;
            color: var(--ink);
            cursor: pointer;
        }
        .field-select-btn:hover {
            border-color: var(--ink);
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .rel-chip {
            display: flex;
            flex-direction: column;
            font-size: 11.5px;
            background: var(--bg);
            border-radius: 7px;
            padding: 5px 12px;
            cursor: pointer;
            border: 1px solid transparent;
            min-width: 100px;
            flex: 0 1 auto;
            transition: border-color 0.15s ease;
        }
        .rel-chip:hover {
            border-color: var(--ink);
        }
        .rel-chip .rc-name {
            font-weight: 600;
            font-size: 12px;
        }
        .rel-chip .rc-sub {
            font-size: 10px;
            color: var(--ink-soft);
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .rel-chip .rc-sub .rc-tag {
            font-family: var(--mono);
            font-size: 8.5px;
            color: var(--ink-soft);
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.05);
            padding: 0 6px;
            border-radius: 4px;
        }
        .rel-chip .rc-sub .rc-deceased {
            color: var(--dead-dark);
            font-family: var(--mono);
            font-size: 8.5px;
            text-transform: uppercase;
            background: var(--dead-light);
            padding: 0 6px;
            border-radius: 4px;
        }

        .notes-box {
            width: 100%;
            min-height: 70px;
            font-family: var(--sans);
            font-size: 12.5px;
            border: 1px solid var(--rail-line);
            border-radius: 8px;
            padding: 10px;
            background: var(--bg);
            color: var(--ink);
            resize: vertical;
        }
        .notes-display {
            font-size: 12.5px;
            line-height: 1.5;
            color: var(--ink);
            white-space: pre-wrap;
        }
        .notes-display.empty {
            color: #B8B8B0;
            font-style: italic;
        }

        .action-link-row {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }
        .action-link {
            flex: 1;
            text-align: center;
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border-radius: 10px;
            padding: 11px 0;
            cursor: pointer;
            border: none;
        }
        .action-link.view-as {
            background: var(--ink);
            color: #fff;
        }
        .action-link.view-as:hover {
            background: #333;
        }
        .action-link.view-as.is-ego {
            background: var(--bg);
            color: var(--ink-soft);
            cursor: default;
        }
        .action-link.add-rel {
            background: var(--status-customary);
            color: #fff;
        }
        .action-link.add-rel:hover {
            background: #326840;
        }

        .exogamy-warning {
            margin-top: 14px;
            background: #FBEAE8;
            border: 1px solid var(--status-severed);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 11.5px;
            color: #8B2A20;
            display: none;
        }
        .exogamy-warning.show {
            display: block;
        }

        /* ---------- SELECT MODAL ---------- */
        #select-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(20, 20, 18, 0.6);
            z-index: 70;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #select-modal-backdrop.open {
            display: flex;
        }
        .select-modal {
            width: 340px;
            max-width: 90vw;
            max-height: 76vh;
            background: #fff;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
        }
        .select-modal-title {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 10px;
        }

            const microOffsets = {};

            function computeMicroOffsets() {
                // group by decade (row index)
                const byDecade = {};
                Object.keys(BASE_LAYOUT).forEach(id => {
                    const p = people[id];
                    if (!p || !p.born) return;
                    const row = Math.floor(BASE_LAYOUT[id].row);
                    if (!byDecade[row]) byDecade[row] = [];
                    byDecade[row].push({ id, born: p.born, month: p._month || 6 });

                Object.keys(byDecade).forEach(rowKey => {
                    const row = parseInt(rowKey);
                    const list = byDecade[row];
                    list.sort((a, b) => a.born - b.born || a.month - b.month);
                    const count = list.length;
                    list.forEach((item, idx) => {
                        // spread between 5px and 25px
                        const frac = count > 1 ? idx / (count - 1) : 0.5;
                        const deltaY = 5 + frac * 20;
                        microOffsets[item.id] = deltaY;
                    });
                });

                    const baseRow = Math.floor(BASE_LAYOUT[id].row);
                    const yearFrac = (p.born - minYear) / (maxYear - minYear);
                    // map to -15px .. +15px within the row

            function yearLabel(p) {
                if (p.deceased && p.date_of_passing) {
                    return `b.${p.born} – d.${p.date_of_passing}`;
                }
                return `b.${p.born}`;
            }

            function renderCardHTML(p) {
                const genderClass = p.gender === 'f' ? 'gender-f' : 'gender-m';
                const statusClass = primaryStatusClassFor(p);
                const deceasedClass = p.deceased ? 'deceased' : '';
                const isSevered = Object.values(p.spouseStatus || {}).includes('Severed / Divorced');
                const img = p.image ?
                    `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;">` :
                    silhouetteFor(p);
                const severedTag = (isSevered && !p.deceased) ? `<div class="severed-tag">Severed</div>` : '';
                const deathTag = p.deceased ? `<div class="deceased-tag">Deceased</div>` : '';
                const egoBadge = p.id === currentEgo ? `<div class="ego-badge">Ego</div>` : '';

                return `
                <div class="card">
                  ${egoBadge}
                  <div class="zone-image" data-role="cascade">
                    <div class="thumb ${genderClass} ${statusClass} ${deceasedClass}">
                      ${severedTag}
                      ${img}
                      ${deathTag}
                    </div>
                  </div>
                  <div class="zone-text" data-role="popover">
                    <div class="name-row">${p.name}</div>
                    <div class="surname-row">${p.surname || ''}</div>
                    <div class="year-row">${yearLabel(p)}</div>
                    <div class="tap-hint">tap for info</div>
                  </div>
                </div>
              `;
            }

            function attachNodeHandlers(node, id) {
                const cascadeZone = node.querySelector('[data-role="cascade"]');
                const popoverZone = node.querySelector('[data-role="popover"]');
                cascadeZone.addEventListener('click', () => toggleCascade(id));
                popoverZone.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showPopover(id, popoverZone);
                });
            }

            function buildNodes() {
                canvas.innerHTML = '';
                canvas.appendChild(svg);
                nodeEls = {};

                Object.keys(people).forEach(id => {
                    const p = people[id];
                    const coord = getLayoutCoord(id);
                    if (!coord) return;
                    const { x, y } = px(coord);

                    const node = document.createElement('div');
                    node.className = 'person-node';
                    node.style.left = x + 'px';
                    node.style.top = y + 'px';
                    node.dataset.id = id;
                    node.innerHTML = renderCardHTML(p);
                    canvas.appendChild(node);
                    nodeEls[id] = node;
                    attachNodeHandlers(node, id);
                });

                let maxX = 0,
                    maxY = 0;
                Object.keys(BASE_LAYOUT).forEach(id => {
                    const coord = getLayoutCoord(id);
                    if (!coord) return;
                    const { x, y } = px(coord);
                    maxX = Math.max(maxX, x + CARD_W + 40);
                    maxY = Math.max(maxY, y + CARD_H + 30);
                });
                canvas.dataset.contentW = maxX;
                canvas.dataset.contentH = maxY;
                canvas.style.width = maxX + 'px';
                canvas.style.height = maxY + 'px';
                svg.setAttribute('width', maxX);
                svg.setAttribute('height', maxY);
            }

            function updateNode(id) {
                const node = nodeEls[id];
                if (!node) return;
                const p = people[id];
                node.innerHTML = renderCardHTML(p);
                attachNodeHandlers(node, id);
            }

            function renderVisibility() {
                Object.keys(nodeEls).forEach(id => {
                    const node = nodeEls[id];
                    node.classList.toggle('hidden-node', !isVisible(id));
                });
                applySearchDimming();
            }

            function applySearchDimming() {
                const term = searchTerm.trim().toLowerCase();
                Object.keys(nodeEls).forEach(id => {
                    const node = nodeEls[id];
                    node.classList.remove('search-dim', 'search-match');
                    if (!term) return;
                    const p = people[id];
                    const hay = (p.name + ' ' + (p.surname || '')).toLowerCase();
                    if (hay.includes(term)) {
                        node.classList.add('search-match');
                    } else {
                        node.classList.add('search-dim');
                    }
                });
            }

            /* -------- CONNECTORS -------- */

            function centerTopOf(id) { const c = getLayoutCoord(id); if (!c) return { x: 0, y: 0 }; const { x, y } = px(
                c); return { x: x + CARD_W / 2, y: y }; }

            function centerBottomOf(id) { const c = getLayoutCoord(id); if (!c) return { x: 0, y: 0 }; const { x, y } =
                px(c); return { x: x + CARD_W / 2, y: y + CARD_H }; }

            function centerLeftOf(id) { const c = getLayoutCoord(id); if (!c) return { x: 0, y: 0 }; const { x, y } = px(
                c); return { x: x, y: y + CARD_H / 2 }; }

            function centerRightOf(id) { const c = getLayoutCoord(id); if (!c) return { x: 0, y: 0 }; const { x, y } =
                px(c); return { x: x + CARD_W, y: y + CARD_H / 2 }; }

            function bothVisible(a, b) { return isVisible(a) && isVisible(b); }

            function branchColorFor(id) {
                const p = people[id];
                return p.branch ? BRANCH_COLOR_HEX[p.branch] : '#B8B8B0';
            }

            function buildConnectorList() {
                const conns = [];

                people.gf.spouses.forEach(s => {
                    if (bothVisible('gf', s)) conns.push({ a: 'gf', b: s, type: 'branch',
                        color: branchColorFor(s) });
                });

                people.gf.spouses.forEach(s => {
                    (people[s].children || []).forEach(c => {
                        if (bothVisible(s, c)) conns.push({ a: s, b: c, type: 'branch',
                            color: branchColorFor(c) });
                    });
                });

                Object.keys(people).forEach(id => {
                    if (FIXED_GEN[id] === 1 && !people.gf.spouses.includes(id)) {
                        const sp = getSpousesOf(id)[0];
                        if (sp && bothVisible(id, sp)) {
                            const status = (people[id].spouseStatus && people[id].spouseStatus[sp]) ||
                                'Customary Union';
                            conns.push({ a: id, b: sp, type: 'spouse', color: statusLineColor(status) });
                        }
                    }
                });

                Object.keys(people).forEach(id => {
                    if (FIXED_GEN[id] === 1 && !people.gf.spouses.includes(id)) {
                        getChildrenOf(id).forEach(gc => {
                            if (FIXED_GEN[gc] === 2 && bothVisible(id, gc)) {
                                conns.push({ a: id, b: gc, type: 'branch', color: branchColorFor(gc) });
                            }
                        });
                    }
                });

                return conns;
            }

            function statusLineColor(status) {
                switch (status) {
                    case 'Civil Marriage':
                        return '#1C1C1C';
                    case 'Customary Union':
                        return '#3E7D4C';
                    case 'Cohabiting / Unregistered':
                        return '#9A9A93';
                    case 'Severed / Divorced':
                        return '#C0392B';
                    default:
                        return '#9A9A93';
                }
            }

            function drawConnectors() {
                svg.innerHTML = '';
                const conns = buildConnectorList();
                const term = searchTerm.trim().toLowerCase();

                conns.forEach(conn => {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    let d;
                    let dimmed = false;
                    if (term) {
                        const aMatch = (people[conn.a].name + ' ' + (people[conn.a].surname || '')).toLowerCase()
                            .includes(term);
                        const bMatch = (people[conn.b].name + ' ' + (people[conn.b].surname || '')).toLowerCase()
                            .includes(term);
                        dimmed = !(aMatch || bMatch);
                    }

                    if (conn.type === 'spouse') {
                        const p1 = centerRightOf(conn.a);
                        const p2 = centerLeftOf(conn.b);
                        const midX = (p1.x + p2.x) / 2;
                        d = `M ${p1.x} ${p1.y} L ${midX} ${p1.y} L ${midX} ${p2.y} L ${p2.x} ${p2.y}`;
                        path.setAttribute('class', 'conn-line spouse' + (dimmed ? ' dimmed' : ''));
                    } else {
                        const p1 = centerBottomOf(conn.a);
                        const p2 = centerTopOf(conn.b);
                        const midY = (p1.y + p2.y) / 2;
                        d = `M ${p1.x} ${p1.y} L ${p1.x} ${midY} L ${p2.x} ${midY} L ${p2.x} ${p2.y}`;
                        path.setAttribute('class', 'conn-line' + (dimmed ? ' dimmed' : ''));
                    }
                    path.setAttribute('d', d);
                    path.setAttribute('stroke', conn.color);
                    svg.appendChild(path);
                });
            }

            function render() {
                renderVisibility();
                requestAnimationFrame(drawConnectors);
                updateAllNodes();
                updateStats();
                updateEgoButton();
            }

            function updateAllNodes() {
                Object.keys(nodeEls).forEach(id => updateNode(id));
                renderVisibility();
            }

            /* =========================================================================
               7. STATS STRIP
               ========================================================================= */

            function updateStats() {
                const all = Object.values(people);
                const total = all.length;
                const blood = all.filter(p => p.relationship_type === 'Bloodline').length;
                const married = all.filter(p => p.relationship_type === 'Married In').length;
                const living = all.filter(p => !p.deceased).length;
                const gens = new Set(Object.values(FIXED_GEN)).size;
                document.getElementById('stat-total').textContent = total;
                document.getElementById('stat-blood').textContent = blood;
                document.getElementById('stat-married').textContent = married;
                document.getElementById('stat-living').textContent = living;
                document.getElementById('stat-gens').textContent = gens;
            }

            /* =========================================================================
               8. STAT LIST MODAL
               ========================================================================= */

            const statListBackdrop = document.getElementById('stat-list-modal-backdrop');
            const statListScroll = document.getElementById('stat-list-scroll');
            const statListTitle = document.getElementById('stat-list-title-text');

            function openStatList(filterType) {
                let list = [];
                let title = '';
                switch (filterType) {
                    case 'all':
                        list = Object.values(people);
                        title = 'All People';
                        break;
                    case 'blood':
                        list = Object.values(people).filter(p => p.relationship_type === 'Bloodline');
                        title = 'Blood Line';
                        break;
                    case 'married':
                        list = Object.values(people).filter(p => p.relationship_type === 'Married In');
                        title = 'Married In';
                        break;
                    case 'living':
                        list = Object.values(people).filter(p => !p.deceased);
                        title = 'Living';
                        break;
                    case 'generations':
                        const genMap = {};
                        Object.keys(FIXED_GEN).forEach(id => {
                            const g = FIXED_GEN[id];
                            if (!genMap[g]) genMap[g] = [];
                            genMap[g].push(people[id]);
                        });
                        // flatten with generation label
                        list = [];
                        Object.keys(genMap).sort((a, b) => a - b).forEach(g => {
                            genMap[g].forEach(p => {
                                list.push({ ...p, _genLabel: 'Generation ' + g });
                            });
                        });
                        title = 'Generations';
                        break;
                    default:
                        return;
                }

                statListTitle.textContent = title + ' (' + list.length + ')';
                statListScroll.innerHTML = '';
                list.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'stat-list-item';
                    const genLabel = p._genLabel || '';
                    const age = calculateAge(p);
                    item.innerHTML = `
                    <span class="sl-name">${p.name} ${p.surname||''}</span>
                    <span class="sl-meta">${p.born || '?'} · ${genLabel || p.relationship_type || ''} · ${age}</span>
                  `;
                    item.addEventListener('click', () => {
                        statListBackdrop.classList.remove('open');
                        focusNode(p.id);
                    });
                    statListScroll.appendChild(item);
                });

                statListBackdrop.classList.add('open');
            }

            document.getElementById('stat-list-close-btn').addEventListener('click', () => {
                statListBackdrop.classList.remove('open');
            });
            statListBackdrop.addEventListener('click', (e) => {
                if (e.target === statListBackdrop) statListBackdrop.classList.remove('open');
            });

            // wire stats cells
            document.querySelectorAll('.stat-cell').forEach(cell => {
                cell.addEventListener('click', () => {
                    const filter = cell.dataset.filter;
                    openStatList(filter);
                });
            });

            /* =========================================================================
               9. DECADE-YEAR MODAL
               ========================================================================= */

            const decadeModalBackdrop = document.getElementById('decade-year-modal-backdrop');
            const decadeScroll = document.getElementById('decade-year-scroll');
            const decadeTitle = document.getElementById('decade-year-title-text');

            function openDecadeYearModal() {
                decadeTitle.textContent = 'Timeline · ' + (railMode === 'decade' ? 'Decade' : 'Year') + ' View';
                decadeScroll.innerHTML = '';

                // group by decade
                const byDecade = {};
                Object.keys(people).forEach(id => {
                    const p = people[id];
                    if (!p.born) return;
                    const decade = Math.floor(p.born / 10) * 10;
                    if (!byDecade[decade]) byDecade[decade] = [];
                    byDecade[decade].push(p);
                });

                const sortedDecades = Object.keys(byDecade).sort((a, b) => a - b);
                sortedDecades.forEach(dec => {
                    const group = document.createElement('div');
                    group.className = 'decade-year-group';
                    const header = document.createElement('div');
                    header.className = 'dy-header';
                    header.textContent = dec + 's';
                    group.appendChild(header);

                    const items = byDecade[dec].sort((a, b) => a.born - b.born);
                    items.forEach(p => {
                        const item = document.createElement('div');
                        item.className = 'dy-item';
                        const age = calculateAge(p);
                        item.innerHTML = `
                        <span class="dy-name">${p.name} ${p.surname||''}</span>
                        <span class="dy-date">b.${p.born} · ${age}</span>
                      `;
                        item.addEventListener('click', () => {
                            decadeModalBackdrop.classList.remove('open');
                            focusNode(p.id);
                        });
                        group.appendChild(item);
                    });
                    decadeScroll.appendChild(group);
                });

                decadeModalBackdrop.classList.add('open');
            }

            document.getElementById('decade-year-close-btn').addEventListener('click', () => {
                decadeModalBackdrop.classList.remove('open');
            });
            decadeModalBackdrop.addEventListener('click', (e) => {
                if (e.target === decadeModalBackdrop) decadeModalBackdrop.classList.remove('open');
            });

            /* =========================================================================
               10. RAIL MODE TOGGLE
               ========================================================================= */

            function toggleRailMode() {
                railMode = (railMode === 'decade') ? 'years' : 'decade';
                document.getElementById('rail-toggle-btn').textContent = railMode === 'decade' ? 'Decade' : 'Year';
                // rebuild nodes with new layout
                computeYearOffsets();
                buildNodes();
                render();
                // re-focus ego
                focusNode(currentEgo);
            }

            /* =========================================================================
               11. POPOVER
               ========================================================================= */

            let activePopover = null;

            function closePopover() {
                if (activePopover) { activePopover.remove();
                    activePopover = null; }
            }

            function marriageSummary(p) {
                if (!p.marriage_type && !p.marital_status) return null;
                const type = p.marriage_type || p.marital_status;
                const date = p.marriage_date ? ` [${p.marriage_date}]` : '';
                return type + date;
            }

            function showPopover(id, anchorEl) {
                closePopover();
                const p = people[id];
                const rel = calcRelation(currentEgo, id);
                const marriage = marriageSummary(p);

                const pop = document.createElement('div');
                pop.className = 'popover';
                pop.innerHTML = `
                <div class="p-name">${p.name} ${p.surname||''}</div>
                <div class="p-years">${yearLabel(p)}</div>
                <div class="pop-field">Totem / Mutupo<b>${p.mutupo || 'Not set'}${p.chidawo ? ' — '+p.chidawo : ''}</b></div>
                <div class="pop-field">Tribe / Heritage<b>${p.language_cluster || 'Not set'}</b></div>
                <div class="pop-field">Location / Base<b>${p.residential_address || p.village_name || 'Not set'}</b></div>
                <div class="pop-field">Relationship to ${people[currentEgo].name}<b>${rel} · ${p.relationship_type || '—'}</b></div>
                <div class="pop-field">Marriage Status<b>${marriage || 'Not set'}</b></div>
                <div class="p-actions">
                  <button class="primary" data-action="profile">View Full Record</button>
                  <button data-action="close">Close</button>
                </div>
              `;

                const nodeRect = anchorEl.closest('.person-node');
                let left = parseFloat(nodeRect.style.left) + CARD_W + 12;
                const contentW = parseFloat(canvas.dataset.contentW || 2400);
                if (left + 240 > contentW) left = parseFloat(nodeRect.style.left) - 252;
                pop.style.left = left + 'px';
                pop.style.top = (parseFloat(nodeRect.style.top)) + 'px';

                canvas.appendChild(pop);
                activePopover = pop;

                pop.querySelector('[data-action="close"]').addEventListener('click', closePopover);
                pop.querySelector('[data-action="profile"]').addEventListener('click', () => {
                    closePopover();
                    openProfile(id);
                });
            }

            document.addEventListener('click', (e) => {
                if (activePopover && !e.target.closest('.popover') && !e.target.closest('[data-role="popover"]')) {
                    closePopover();
                }
            });

            /* =========================================================================
               12. PROFILE OVERLAY (extended schema)
               ========================================================================= */

            const overlayBackdrop = document.getElementById('overlay-backdrop');
            const profileContent = document.getElementById('profile-modal-content');
            const fileInput = document.getElementById('hidden-file-input');
            let profileTargetId = null;
            let profileEditMode = false;

            function fieldVal(v) {
                if (v === '' || v === null || v === undefined || (Array.isArray(v) && !v.length))
                    return `<span class="field-item-value empty">Not set</span>`;
                if (Array.isArray(v)) return `<span class="field-item-value">${v.join(', ')}</span>`;
                return `<span class="field-item-value">${v}</span>`;
            }

            function fieldEditText(id, key, label, placeholder) {
                const val = people[id][key] || '';
                return `
                <div class="field-item">
                  <div class="field-item-label">${label}</div>
                  <input class="field-edit-input" data-field="${key}" type="text" value="${val.replace(/"/g,'&quot;')}" placeholder="${placeholder||''}">
                </div>
              `;
            }

            function fieldViewText(id, key, label) {
                return `
                <div class="field-item">
                  <div class="field-item-label">${label}</div>
                  ${fieldVal(people[id][key])}
                </div>
              `;
            }

            function fieldSelectBtn(id, key, label, listType) {
                const val = people[id][key] || 'Not set';
                return `
                <div class="field-item">
                  <div class="field-item-label">${label}</div>
                  <button class="field-select-btn" data-select="${listType}" data-field="${key}">${val}</button>
                </div>
              `;
            }

            function renderRelChips(ids, tagLabel) {
                if (!ids || !ids.length) return `<span class="field-item-value empty">None recorded</span>`;
                return `<div class="chip-row">${ids.map(rid=>{
                const rp = people[rid];
                if (!rp) return '';
                const age = calculateAge(rp);
                const deceasedTag = rp.deceased ? `<span class="rc-deceased">Late</span>` : '';
                return `<div class="rel-chip" data-jump="${rid}">
                  <span class="rc-name">${rp.name} ${rp.surname||''}</span>
                  <span class="rc-sub">
                    <span>${tagLabel}</span>
                    <span>·</span>
                    <span>${age}</span>
                    ${deceasedTag}
                    <span class="rc-tag">${rp.relationship_type || ''}</span>
                  </span>
                </div>`;
              }).join('')}</div>`;
            }

            function openProfile(id) {
                profileTargetId = id;
                profileEditMode = false;
                renderProfileModal();
                overlayBackdrop.classList.add('open');
            }

                    `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;">` :
                    silhouetteFor(p);

                <div class="field-grid three">

                  ${fieldEditText(id,'nationalities','Nationalities (comma)','Zimbabwean, ...')}
                  ${fieldEditText(id,'languages','Languages (comma)','Shona, Ndebele, ...')}

                <div class="field-grid">

                  ${fieldSelectBtn(id,'province','Province','province')}
                  ${fieldEditText(id,'district','District')}
                  ${fieldEditText(id,'constituency','Constituency')}
                  ${fieldEditText(id,'ward','Ward Number')}
                  ${fieldEditText(id,'village_name','Village Name')}

              ` : `
                <div class="field-grid">
                  ${fieldViewText(id,'place_of_birth','Place of Birth')}
                  ${fieldViewText(id,'province','Province')}
                  ${fieldViewText(id,'district','District')}
                  ${fieldViewText(id,'constituency','Constituency')}
                  ${fieldViewText(id,'ward','Ward Number')}
                  ${fieldViewText(id,'village_name','Village Name')}
                  ${fieldViewText(id,'headman','Headman (Sabhuku)')}
                  ${fieldViewText(id,'chief','Chief (Ishe/Mambo)')}
                  ${fieldViewText(id,'ancestral_home','Ancestral Home District')}
                  ${fieldViewText(id,'coordinates','Coordinates')}
                  ${fieldViewText(id,'residential_address','Residential Address')}
                </div>
              `;

                // --- Totemic ---
                const totemicFields = edit ? `
                <div class="field-grid">
                  ${fieldSelectBtn(id,'mutupo','Mutupo (Totem)','mutupo')}
                  ${fieldSelectBtn(id,'chidawo','Chidawo (Praise)','chidawo')}

                  ${fieldEditText(id,'employment_status','Employment Status')}

                  ${fieldEditText(id,'national_id','National ID','63-XXXXXX-X-27')}
                </div>
              ` : `
                <div class="field-grid">
                  ${fieldViewText(id,'mutupo','Mutupo (Totem)')}
                  ${fieldViewText(id,'chidawo','Chidawo (Praise)')}
                  ${fieldViewText(id,'maternal_totem','Maternal Totem')}
                  ${fieldViewText(id,'maternal_chidawo','Maternal Chidawo')}
                  ${fieldViewText(id,'language_cluster','Language Cluster')}
                  ${fieldViewText(id,'religion','Religion')}
                  ${fieldViewText(id,'education_level','Education Level')}
                  ${fieldViewText(id,'employment_status','Employment Status')}

                // --- Work History (with nested modal trigger) ---
                const workHistory = (p.work_history || []).length > 0 ?

                // --- Flags ---

                wireProfileHandlers(id);

            function wireProfileHandlers(id) {
                document.getElementById('profile-close-btn').addEventListener('click', closeProfile);
                document.getElementById('change-img-btn').addEventListener('click', () => fileInput.click());

                document.getElementById('mode-view-btn').addEventListener('click', () => {
                    if (profileEditMode) saveProfileEdits(id);
                    profileEditMode = false;
                    renderProfileModal();
                });
                document.getElementById('mode-edit-btn').addEventListener('click', () => {
                    profileEditMode = true;
                    renderProfileModal();
                });

                const viewAsBtn = document.getElementById('view-as-this-btn');
                if (id !== currentEgo) {
                    viewAsBtn.addEventListener('click', () => { setEgo(id);
                        closeProfile(); });
                }

                document.getElementById('add-relative-btn').addEventListener('click', () => {
                    alert('Add Relative: connect this node to a new person record. (Placeholder)');
                });

                profileContent.querySelectorAll('[data-jump]').forEach(chip => {
                    chip.addEventListener('click', () => {
                        if (profileEditMode && profileTargetId) saveProfileEdits(profileTargetId);
                        const targetId = chip.dataset.jump;
                        openProfile(targetId);
                    });
                });

                profileContent.querySelectorAll('[data-select]').forEach(btn => {
                    btn.addEventListener('click', () => openSelectModal(btn.dataset.select, btn.dataset.field,
                        id));
                });

                // Nested modal triggers
                const eduBtn = document.getElementById('edit-education-btn');
                if (eduBtn) eduBtn.addEventListener('click', () => openNestedModal('education', id));
                const workBtn = document.getElementById('edit-work-btn');
                if (workBtn) workBtn.addEventListener('click', () => openNestedModal('work', id));
                const migBtn = document.getElementById('edit-migration-btn');
                if (migBtn) migBtn.addEventListener('click', () => openNestedModal('migration', id));
                const galBtn = document.getElementById('edit-gallery-btn');
                if (galBtn) galBtn.addEventListener('click', () => openNestedModal('gallery', id));
            }

            function saveProfileEdits(id) {
                const p = people[id];
                profileContent.querySelectorAll('.field-edit-input').forEach(input => {
                    const key = input.dataset.field;
                    if (key === 'aliases' || key === 'nationalities' || key === 'languages') {
                        p[key] = input.value.split(',').map(s => s.trim()).filter(Boolean);
                    } else if (key === 'family_head') {
                        p[key] = input.value.toLowerCase() === 'true';
                    } else {
                        p[key] = input.value;
                    }
                });
                const notesBox = document.getElementById('notes-edit-box');
                if (notesBox) p.notes = notesBox.value;
                updateNode(id);
                renderVisibility();
                updateStats();
            }

            function closeProfile() {
                if (profileEditMode && profileTargetId) saveProfileEdits(profileTargetId);
                overlayBackdrop.classList.remove('open');
                profileTargetId = null;
                profileEditMode = false;
            }

            overlayBackdrop.addEventListener('click', (e) => { if (e.target === overlayBackdrop) closeProfile(); });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file || !profileTargetId) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    people[profileTargetId].image = evt.target.result;
                    renderProfileModal();
                    updateNode(profileTargetId);
                    renderVisibility();
                };
                reader.readAsDataURL(file);
            });

            /* =========================================================================
               13. NESTED MODAL (Work / Education / Migration / Gallery)
               ========================================================================= */

            const nestedBackdrop = document.getElementById('nested-modal-backdrop');
            const nestedScroll = document.getElementById('nested-modal-scroll');
            const nestedTitle = document.getElementById('nested-modal-title');
            let nestedContext = { type: '', personId: '' };

            function openNestedModal(type, personId) {
                nestedContext = { type, personId };
                const p = people[personId];
                let title = '';
                let content = '';

                switch (type) {
                    case 'education':
                        title = 'Education Timeline';
                        const edu = p.education_history || [];
                        content = edu.length ? edu.map((e, i) =>
                            `<div style="padding:8px 0;border-bottom:1px solid var(--bg);">
                            <strong>${e.institution}</strong> (${e.from}–${e.to})<br>
                            <span style="font-size:12px;color:var(--ink-soft);">${e.activities||''} ${e.subjects||''}</span>
                          </div>`
                        ).join('') : '<div style="color:var(--ink-soft);">No education records.</div>';
                        content +=
                            `<button class="field-select-btn" style="margin-top:10px;width:auto;" id="nested-add-btn">+ Add Entry</button>`;
                        break;
                    case 'work':
                        title = 'Work History';
                        const work = p.work_history || [];
                        content = work.length ? work.map((w, i) =>
                            `<div style="padding:8px 0;border-bottom:1px solid var(--bg);">
                            <strong>${w.role}</strong> at ${w.company} (${w.from}–${w.to})<br>
                            <span style="font-size:12px;color:var(--ink-soft);">${w.responsibilities||''}</span>
                          </div>`
                        ).join('') : '<div style="color:var(--ink-soft);">No work records.</div>';
                        content +=
                            `<button class="field-select-btn" style="margin-top:10px;width:auto;" id="nested-add-btn">+ Add Entry</button>`;
                        break;
                    case 'migration':
                        title = 'Migration History';
                        const mig = p.migration_history || [];
                        content = mig.length ? mig.map((m, i) =>
                            `<div style="padding:8px 0;border-bottom:1px solid var(--bg);">
                            ${m.from} → ${m.to} (${m.date})<br>
                            <span style="font-size:12px;color:var(--ink-soft);">${m.reason||''}</span>
                          </div>`
                        ).join('') : '<div style="color:var(--ink-soft);">No migration records.</div>';
                        content +=
                            `<button class="field-select-btn" style="margin-top:10px;width:auto;" id="nested-add-btn">+ Add Entry</button>`;
                        break;
                    case 'gallery':
                        title = 'Photo Gallery';
                        const gal = p.photo_gallery || [];
                        content = gal.length ? gal.map((url, i) =>
                            `<div style="padding:4px 0;"><a href="${url}" target="_blank" style="color:var(--ink);">📷 Image ${i+1}</a></div>`
                        ).join('') :
                            '<div style="color:var(--ink-soft);">No gallery images.</div>';
                        content +=
                            `<button class="field-select-btn" style="margin-top:10px;width:auto;" id="nested-add-btn">+ Add Image URL</button>`;
                        break;
                    default:
                        content = '<div style="color:var(--ink-soft);">No data.</div>';
                }

                nestedTitle.textContent = title;
                nestedScroll.innerHTML = content;
                nestedBackdrop.classList.add('open');

                const addBtn = document.getElementById('nested-add-btn');
                if (addBtn) {
                    addBtn.addEventListener('click', () => {
                        const val = prompt('Enter new entry (format depends on section):');
                        if (val) {
                            // simple append — in production you'd parse structured data
                            if (type === 'education') {
                                if (!p.education_history) p.education_history = [];
                                p.education_history.push({ institution: val, from: '', to: '' });
                            } else if (type === 'work') {
                                if (!p.work_history) p.work_history = [];
                                p.work_history.push({ company: val, role: '', from: '', to: '' });
                            } else if (type === 'migration') {
                                if (!p.migration_history) p.migration_history = [];
                                p.migration_history.push({ from: val, to: '', date: '', reason: '' });
                            } else if (type === 'gallery') {
                                if (!p.photo_gallery) p.photo_gallery = [];
                                p.photo_gallery.push(val);
                            }
                            openNestedModal(type, personId);
                            renderProfileModal();
                        }
                    });
                }
            }

            document.getElementById('nested-modal-back-btn').addEventListener('click', () => {
                nestedBackdrop.classList.remove('open');
                renderProfileModal();
            });
            nestedBackdrop.addEventListener('click', (e) => {
                if (e.target === nestedBackdrop) nestedBackdrop.classList.remove('open');
            });

            /* =========================================================================
               14. SELECTION MODALS
               ========================================================================= */

            const selectModalBackdrop = document.getElementById('select-modal-backdrop');
            const selectModalTitle = document.getElementById('select-modal-title');
            const selectModalSearch = document.getElementById('select-modal-search');
            const selectModalList = document.getElementById('select-modal-list');
            let selectModalContext = null;

            function getListData(listType) {
                switch (listType) {
                    case 'mutupo':
                        return TOTEM_TABLE.map(t => ({ label: t.totem, sub: t.chidawo }));
                    case 'chidawo':
                        return TOTEM_TABLE.map(t => ({ label: t.chidawo, sub: t.totem }));
                    case 'language':
                        return LANGUAGE_CLUSTERS.map(l => ({ label: l }));
                    case 'province':
                        return PROVINCES.map(p => ({ label: p }));
                    case 'marital_status':
                        return MARITAL_STATUSES.map(s => ({ label: s }));
                    case 'marriage_type':
                        return MARRIAGE_TYPES.map(s => ({ label: s }));
                    case 'roora':
                        return ROORA_STATUSES.map(s => ({ label: s }));
                    case 'gender':
                        return GENDERS.map(g => ({ label: g }));
                    default:
                        return [];
                }
            }

            function openSelectModal(listType, field, personId) {
                selectModalContext = { listType, field, personId };
                selectModalTitle.textContent = 'Select — ' + field.replace(/_/g, ' ');
                selectModalSearch.value = '';
                renderSelectList('');
                selectModalBackdrop.classList.add('open');
                selectModalSearch.focus();
            }

            function renderSelectList(filter) {
                const data = getListData(selectModalContext.listType);
                const f = filter.trim().toLowerCase();
                const filtered = data.filter(d => !f || d.label.toLowerCase().includes(f) || (d.sub || '').toLowerCase()
                    .includes(f));
                selectModalList.innerHTML = filtered.map(d =>
                    `<div class="select-modal-item" data-value="${d.label.replace(/"/g,'&quot;')}">
                    <span>${d.label}</span>
                    ${d.sub ? `<span class="smi-sub">${d.sub}</span>` : ''}
                  </div>`
                ).join('') || `<div style="padding:14px;color:var(--ink-soft);font-size:13px;">No matches.</div>`;

                selectModalList.querySelectorAll('.select-modal-item').forEach(item => {
                    item.addEventListener('click', () => {
                        applySelectValue(item.dataset.value);
                    });
                });
            }

            function applySelectValue(value) {
                const { field, personId } = selectModalContext;
                const p = people[personId];
                if (field === 'mutupo' || field === 'chidawo') {
                    const prevOther = field === 'mutupo' ? p.chidawo : p.mutupo;
                    p[field] = value;
                    checkExogamy(personId);
                } else {
                    p[field] = value;
                }
                selectModalBackdrop.classList.remove('open');
                if (profileTargetId === personId) renderProfileModal();
            }

            function checkExogamy(personId) {
                const p = people[personId];
                const warnBox = document.getElementById('exogamy-warning-box');
                if (!warnBox || !p.mutupo || !p.chidawo) return;
                const conflict = getSpousesOf(personId).some(spId => {
                    const sp = people[spId];
                    return sp.mutupo === p.mutupo && sp.chidawo === p.chidawo;
                });
                warnBox.classList.toggle('show', conflict);
            }

            selectModalSearch.addEventListener('input', (e) => renderSelectList(e.target.value));
            selectModalBackdrop.addEventListener('click', (e) => {
                if (e.target === selectModalBackdrop) selectModalBackdrop.classList.remove('open');
            });

            /* =========================================================================
               15. EGO SWITCHING
               ========================================================================= */

            const egoSwitchBtn = document.getElementById('ego-switch-btn');
            const egoPrevBtn = document.getElementById('ego-prev-btn');
            const egoNextBtn = document.getElementById('ego-next-btn');
            const egoPickerBackdrop = document.getElementById('ego-picker-backdrop');
            const egoPickerList = document.getElementById('ego-picker-list');

            function getVisiblePeopleList() {
                return getVisiblePeople();
            }

            function setEgo(id) {
                currentEgo = id;
                resetState();
                // expand to show at least immediate relations
                people.gf.spouses.forEach(s => visible[s] = true);
                buildNodes();
                render();
                updateEgoButton();
                setTimeout(() => focusNode(id), 100);
            }

            function updateEgoButton() {
                const p = people[currentEgo];
                if (p) {
                    egoSwitchBtn.textContent = p.name + ' ' + (p.surname || '');
                }
            }

            function egoNavigate(delta) {
                const visibleList = getVisiblePeopleList();
                if (!visibleList.length) return;
                const idx = visibleList.indexOf(currentEgo);
                if (idx === -1) {
                    setEgo(visibleList[0]);
                    return;
                }
                const newIdx = (idx + delta + visibleList.length) % visibleList.length;
                setEgo(visibleList[newIdx]);
            }

            egoPrevBtn.addEventListener('click', () => egoNavigate(-1));
            egoNextBtn.addEventListener('click', () => egoNavigate(1));

            egoSwitchBtn.addEventListener('click', openEgoPicker);

            function openEgoPicker() {
                egoPickerList.innerHTML = '';
                Object.values(people)
                    .sort((a, b) => a.born - b.born)
                    .forEach(p => {
                        const item = document.createElement('div');
                        item.className = 'ego-picker-item';
                        item.innerHTML =
                            `<span>${p.name}${p.id===currentEgo ? ' (current)' : ''}</span><span class="yr">b.${p.born}</span>`;
                        item.addEventListener('click', () => {
                            setEgo(p.id);
                            egoPickerBackdrop.classList.remove('open');
                        });
                        egoPickerList.appendChild(item);
                    });
                egoPickerBackdrop.classList.add('open');
            }

            egoPickerBackdrop.addEventListener('click', (e) => {
                if (e.target === egoPickerBackdrop) egoPickerBackdrop.classList.remove('open');
            });

            /* =========================================================================
               16. ZOOM CONTROLS
               ========================================================================= */

            function applyZoom() {
                canvas.style.transform = `scale(${zoomLevel})`;
            }

            document.getElementById('zoom-in').addEventListener('click', () => {
                zoomLevel = Math.min(1.6, zoomLevel + 0.1);
                applyZoom();
            });
            document.getElementById('zoom-out').addEventListener('click', () => {
                zoomLevel = Math.max(0.15, zoomLevel - 0.1);
                applyZoom();
            });
            document.getElementById('zoom-fit').addEventListener('click', () => {
                expandAll();
                render();
                requestAnimationFrame(() => {
                    const contentW = parseFloat(canvas.dataset.contentW || 2400);
                    const contentH = parseFloat(canvas.dataset.contentH || 1400);
                    const vw = viewport.clientWidth;
                    const vh = viewport.clientHeight;
                    const scaleX = vw / contentW;
                    const scaleY = vh / contentH;
                    zoomLevel = Math.max(0.12, Math.min(scaleX, scaleY) * 0.96);
                    applyZoom();
                    viewport.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
                    setTimeout(() => focusNode(currentEgo), 200);
                });
            });

            /* =========================================================================
               17. SEARCH
               ========================================================================= */

            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value;
                applySearchDimming();
                drawConnectors();
                if (searchTerm.trim()) {
                    const term = searchTerm.trim().toLowerCase();
                    const match = Object.values(people).find(p =>
                        (p.name + ' ' + (p.surname || '')).toLowerCase().includes(term) && isVisible(p.id)
                    );
                    if (match) {
                        focusNode(match.id);
                    }
                }
            });

            /* =========================================================================
               18. LEGEND TOGGLE
               ========================================================================= */

            const legendPanel = document.getElementById('legend-panel');
            document.getElementById('legend-toggle-btn-top').addEventListener('click', () => {
                legendPanel.classList.toggle('open');
            });

            /* =========================================================================
               19. INIT
               ========================================================================= */

            buildRail();
            buildNodes();
            render();
            // initial focus
            setTimeout(() => focusNode(currentEgo), 200);

            // re-draw connectors on resize
            window.addEventListener('resize', () => requestAnimationFrame(drawConnectors));

            // Expose for debug
            window.__people = people;
            window.__setEgo = setEgo;

        })();
    </script>
</body>
</html>
