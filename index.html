<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#161421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Roots — Zimbabwe Genealogy</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<div id="app">

  <!-- ============ WELCOME SCREEN ============ -->
  <div id="welcome-screen" class="screen active">
    <div class="welcome-content">
      <div class="welcome-logo">
        <svg viewBox="0 0 100 100" width="100" height="100">
          <circle cx="50" cy="38" r="18" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
          <circle cx="22" cy="52" r="13" fill="none" stroke="var(--accent)" stroke-width="2"/>
          <circle cx="78" cy="52" r="13" fill="none" stroke="var(--accent)" stroke-width="2"/>
          <path d="M50 56 L50 90" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M50 62 L30 52" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
          <path d="M50 62 L70 52" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="50" cy="38" r="4" fill="var(--accent)"/>
        </svg>
      </div>
      <div class="welcome-sub">Zimbabwe Genealogy Platform</div>
      <div class="welcome-title">Roots</div>
      <div class="welcome-tagline">Preserve lineage. Share heritage.<br>Connect generations.</div>
      <div class="welcome-buttons">
        <button class="btn-gate primary" id="btnRegular">👤 Regular User</button>
        <button class="btn-gate secondary" id="btnInstitutional">🏛️ Institutional User</button>
        <button class="btn-gate secondary" id="btnAdministrator">🛡️ Roots Administrator</button>
      </div>
    </div>
    <div class="welcome-footer">Offline-First · v1.0</div>
  </div>

  <!-- ============ ACCOUNT GATE (Regular User) ============ -->
  <div id="account-screen" class="screen">
    <div class="welcome-content">
      <div class="welcome-sub">Regular User</div>
      <div class="welcome-title" style="font-size:1.7rem;">Choose your path</div>
      <div class="welcome-tagline">View an existing family tree,<br>or start building your own.</div>
      <div class="welcome-buttons">
        <button class="btn-gate primary" id="btnLoginFamily">🔑 Login as Kudzanai Chitate</button>
        <button class="btn-gate secondary" id="btnCreateProfile">➕ Create Profile</button>
      </div>
      <button class="gate-backlink" id="accountBack">← Back</button>
    </div>
    <div class="welcome-footer">Offline-First · v1.0</div>
  </div>

  <!-- ============ REGULAR USER APP ============ -->
  <div id="regular-app" class="screen">
    <div class="app-topbar">
      <span class="topbar-back" id="topbarBack">‹</span>
      <span class="topbar-title" id="topbarTitle">Profile</span>
      <span class="topbar-action" id="settingsBtn">⚙️</span>
    </div>
    <div class="main-content">

      <!-- GROUPS VIEW -->
      <div id="groups-view" class="view">
        <div class="groups-top">
          <h2>My Groups</h2>
          <button class="btn-sm" id="newGroupBtn">+ New</button>
        </div>
        <div id="groupsList"></div>
      </div>

      <!-- PROFILE VIEW -->
      <div id="profile-view" class="view">
        <div class="profile-hero">
          <div class="profile-avatar" id="myAvatar">👤</div>
          <div class="profile-name" id="myName">—</div>
          <div class="profile-totem" id="myTotem"></div>
        </div>
        <button class="profile-groups-btn" id="goGroupsBtn">
          <img src="assets/icons/people.svg" alt="">
          <span>My Groups</span>
        </button>
        <button class="profile-groups-btn subtle" id="switchAccountBtn">
          <span>⇄</span>
          <span>Switch Account</span>
        </button>
        <div class="profile-body" id="myProfileBody"></div>
      </div>

    </div>

    <!-- BOTTOM NAV (4 white icons) -->
    <div class="bottom-nav">
      <div class="nav-item" data-page="timeline" data-href="timeline.html"><img src="assets/icons/clock.svg" alt="Timeline"></div>
      <div class="nav-item" data-page="tree" data-href="tree.html"><img src="assets/icons/tree.svg" alt="Family Tree"></div>
      <div class="nav-item" data-page="library" data-href="library.html"><img src="assets/icons/read-book.svg" alt="Library"></div>
      <div class="nav-item active" data-view="profile"><img src="assets/icons/profile-picture.svg" alt="Profile"></div>
    </div>
  </div>

  <!-- ============ INSTITUTIONAL USER ============
       Moved to institutional/ (login gate + workspace).
       The welcome-gate button routes to the institutional login. -->

  <!-- Tree profile panel, TCM overlays, ego picker, selection modal,
       settings, death & marriage panels now live in tree.html /
       settings.js (shared). -->

  <!-- ============ MODAL (add group) ============ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet" id="modalSheet">
      <div class="panel-handle"></div>
      <div class="modal-title" id="modalTitle">New Group</div>
      <div id="modalBody"></div>
      <button class="modal-btn secondary" id="modalCancel">Cancel</button>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div id="toast"></div>
</div>

<script src="data.js"></script>
<script src="lookups.js"></script>
<script src="customary.js"></script>
<script src="shell.js"></script>
<script src="store.js"></script>
<script src="dataset_v2.js"></script>
<script src="dataset.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
