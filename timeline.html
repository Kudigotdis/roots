<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#161421">
<title>Roots — Timeline</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="timeline" data-back="index.html">
<div id="app">
  <div class="screen active">

    <!-- TOP BAR (shared shell) -->
    <div class="app-topbar">
      <span class="topbar-back" id="topbarBack">‹</span>
      <span class="topbar-title">Timeline</span>
      <a class="topbar-action" href="index.html#settings">⚙️</a>
    </div>

    <!-- CONTENT -->
    <div class="main-content">
      <div class="view active">
        <div class="ig-topbar">
          <h2 class="ig-title">Roots</h2>
          <span class="ig-notif-btn" id="igNotifBtn">♥</span>
        </div>
        <div class="ig-stories" id="igStories"></div>
        <div class="ig-divider"></div>
        <div id="timelineFeed"></div>
      </div>
    </div>

    <!-- BOTTOM NAV (shared shell) -->
    <div class="bottom-nav">
      <div class="nav-item active" data-page="timeline"><img src="assets/icons/clock.svg" alt="Timeline"></div>
      <div class="nav-item" data-page="tree" data-href="tree.html"><img src="assets/icons/tree.svg" alt="Family Tree"></div>
      <div class="nav-item" data-page="library" data-href="library.html"><img src="assets/icons/read-book.svg" alt="Library"></div>
      <div class="nav-item" data-page="home" data-href="index.html#profile"><img src="assets/icons/profile-picture.svg" alt="Profile"></div>
    </div>

  </div>

  <div id="toast"></div>
  <input type="file" id="tlFileInput" accept="image/*" style="display:none;">
</div>

<script src="data.js"></script>
<script src="lookups.js"></script>
<script src="customary.js"></script>
<script src="shell.js"></script>
<script src="store.js"></script>
<script src="timeline.js"></script>
</body>
</html>
