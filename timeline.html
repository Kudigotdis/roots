<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Roots · Timeline</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== DESIGN TOKENS ===== */
        :root {
            --bg: #F8F9FA;
            --surface: #FFFFFF;
            --surface-alt: #F1F3F5;
            --primary: #2B5E3C;
            --primary-dark: #1E422A;
            --primary-light: #E9F0EC;
            --accent: #D4AF37;
            --accent-light: #F9F5E8;
            --danger: #E03131;
            --text: #1A1A1A;
            --text-light: #6C757D;
            --text-muted: #ADB5BD;
            --border: #E9ECEF;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.10);
            --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 0 0 80px 0;
        }

        #app {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
            padding: 0 0 20px 0;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #CED4DA;
            border-radius: 10px;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--surface);
            padding: 14px 20px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.92);
        }
        .topbar .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .topbar .logo span {
            color: var(--accent);
        }
        .topbar-actions {
            display: flex;
            gap: 6px;
        }
        .topbar-actions button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 50%;
            transition: background var(--transition);
            font-size: 1.2rem;
            color: var(--text);
        }
        .topbar-actions button:hover {
            background: var(--surface-alt);
        }

        /* ===== FEED ===== */
        #timelineFeed {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px 16px 100px;
            /* padding bottom to avoid overlap with sticky story rail */
        }

        /* ===== POST-CARD ===== */
        .post-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: box-shadow var(--transition);
        }
        .post-card:hover {
            box-shadow: var(--shadow-lg);
        }

        /* --- Media Container (the tap area) --- */
        .post-media {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #E8EAED;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .post-media:active {
            opacity: 0.85;
        }
        .post-media img,
        .post-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .post-media .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.8rem;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        /* --- Collapsible Content --- */
        .post-body {
            padding: 0 16px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                padding 0.3s ease,
                opacity 0.25s ease;
            opacity: 0;
            background: var(--surface);
        }
        .post-body.open {
            max-height: 600px;
            padding: 16px 16px 12px;
            opacity: 1;
        }

        /* --- Card Header (inside expanded) --- */
        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .post-header .avatar-sm {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            /* square with rounded corners */
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--primary-dark);
            flex-shrink: 0;
            overflow: hidden;
        }
        .post-header .avatar-sm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .post-header .meta {
            flex: 1;
        }
        .post-header .meta .name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.2;
        }
        .post-header .meta .name .badge {
            font-weight: 600;
            font-size: 0.7rem;
            color: var(--text-light);
            background: var(--surface-alt);
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 6px;
        }
        .post-header .meta .time {
            font-size: 0.75rem;
            color: var(--text-light);
            font-weight: 500;
        }

        /* --- Caption --- */
        .post-caption {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text);
            margin-bottom: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .post-caption .mention {
            color: var(--primary);
            font-weight: 600;
        }

        /* --- Action Row --- */
        .post-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .post-actions .left {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .post-actions .right {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-light);
            padding: 6px 8px;
            border-radius: 20px;
            transition: all var(--transition);
            font-family: var(--font);
        }
        .action-btn:hover {
            background: var(--surface-alt);
            color: var(--text);
        }
        .action-btn.liked {
            color: var(--danger);
        }
        .action-btn.liked:hover {
            background: #FFF0F0;
        }
        .action-btn .icon {
            font-size: 1.2rem;
            line-height: 1;
        }
        .action-btn .count {
            font-size: 0.75rem;
            font-weight: 600;
        }
        .action-btn.share-btn:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        .post-meta-tag {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--surface-alt);
            padding: 4px 8px;
            border-radius: 12px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== STORY RAIL (BOTTOM STICKY) ===== */
        .story-rail {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 15;
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 12px 20px 14px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
            scrollbar-width: none;
            /* Firefox */
        }
        .story-rail::-webkit-scrollbar {
            display: none;
            /* Chrome/Safari */
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform var(--transition);
        }
        .story-item:hover {
            transform: translateY(-2px);
        }

        /* Square avatar with rounded corners */
        .story-ring {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            /* square with rounded corners */
            overflow: hidden;
            background: var(--surface);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .story-ring .avatar {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary-dark);
            background: var(--primary-light);
            overflow: hidden;
            text-transform: uppercase;
            border-radius: 12px;
            /* slightly smaller radius inside */
        }

        /* Add Story Avatar — distinct style */
        .story-ring .avatar.add {
            background: var(--surface);
            color: var(--primary);
            font-size: 2rem;
            font-weight: 300;
            border: 2px dashed var(--primary);
            border-radius: 12px;
            transition: background var(--transition), border-color var(--transition);
        }
        .story-ring .avatar.add:hover {
            background: var(--primary-light);
            border-color: var(--primary-dark);
        }

        /* For stories with custom background */
        .story-ring .avatar[style*="background"] {
            border-radius: 12px;
        }

        .story-item .label {
            font-size: 0.65rem;
            color: var(--text-light);
            font-weight: 600;
            max-width: 64px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            text-align: center;
        }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 100;
            max-width: 90%;
            text-align: center;
            font-family: var(--font);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .topbar {
                padding: 12px 16px 10px;
            }
            .topbar .logo {
                font-size: 1.1rem;
            }
            #timelineFeed {
                padding: 12px 12px 80px;
                gap: 14px;
            }
            .post-body.open {
                padding: 14px 14px 10px;
            }
            .post-caption {
                font-size: 0.9rem;
            }
            .action-btn {
                font-size: 0.75rem;
                padding: 4px 6px;
            }
            .action-btn .icon {
                font-size: 1.1rem;
            }
            .story-ring {
                width: 52px;
                height: 52px;
                border-radius: 12px;
            }
            .story-ring .avatar {
                border-radius: 10px;
                font-size: 1rem;
            }
            .story-rail {
                padding: 10px 16px 12px;
                gap: 10px;
            }
        }

        @media (min-width: 600px) {
            #app {
                border-left: 1px solid var(--border);
                border-right: 1px solid var(--border);
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.04);
                background: var(--surface);
            }
            body {
                background: #EDEDE9;
                padding: 20px 0 80px;
            }
            .post-card {
                border-radius: var(--radius);
            }
            .topbar {
                border-radius: var(--radius) var(--radius) 0 0;
                background: var(--surface);
                backdrop-filter: none;
            }
            .story-rail {
                border-radius: 0 0 var(--radius) var(--radius);
                background: var(--surface);
                backdrop-filter: none;
                border-bottom: 1px solid var(--border);
            }
        }

        /* ===== UTILITY ===== */
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-1 {
            margin-top: 6px;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-light);
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            color: var(--text);
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 0.9rem;
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- TOP BAR -->
        <header class="topbar">
            <div class="logo">🌿 Roots<span>.</span></div>
            <div class="topbar-actions">
                <button onclick="showToast('🔔 Notifications coming soon')" aria-label="Notifications">🔔</button>
                <button onclick="showToast('💬 Messages coming soon')" aria-label="Messages">💬</button>
            </div>
        </header>

        <!-- FEED -->
        <div id="timelineFeed"></div>

        <!-- STORY RAIL (BOTTOM STICKY) -->
        <div class="story-rail" id="storyRail">
            <div class="story-item" onclick="showToast('📸 Add your story!')">
                <div class="story-ring"><div class="avatar add">+</div></div>
                <span class="label">Add Story</span>
            </div>
            <!-- stories injected by JS -->
        </div>

        <!-- TOAST -->
        <div id="toast"></div>

        <!-- HIDDEN FILE INPUT FOR COMPOSE (kept for future use) -->
        <input type="file" id="composeFileInput" accept="image/*,video/*" style="display:none" />
    </div>

    <script>
        /* ============================================================
           ROOTS · TIMELINE ENGINE
           ============================================================ */

        // ─── STATE ──────────────────────────────────────────────────────
        const state = {
            posts: [],
            likedPosts: new Set(),
            nextId: 1,
        };

        // ─── DOM REFS ──────────────────────────────────────────────────
        const feed = document.getElementById('timelineFeed');
        const toast = document.getElementById('toast');
        const storyRail = document.getElementById('storyRail');

        // ─── TOAST ─────────────────────────────────────────────────────
        function showToast(msg, duration = 2800) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ─── MOCK DATA ─────────────────────────────────────────────────
        const MOCK_USERS = [
            { name: 'Tendai Moyo', initials: 'TM', color: '#2B5E3C' },
            { name: 'Rudo Shava', initials: 'RS', color: '#8B5A2B' },
            { name: 'Sekuru Gudo', initials: 'SG', color: '#5C3A1E' },
            { name: 'Ambuya Mai', initials: 'AM', color: '#7A4A6B' },
            { name: 'Nyasha Matenga', initials: 'NM', color: '#1E6B7A' },
            { name: 'Tafadzwa Dube', initials: 'TD', color: '#3D5A3D' },
        ];

        function randomUser() {
            return MOCK_USERS[Math.floor(Math.random() * MOCK_USERS.length)];
        }

        function randomDate() {
            const now = new Date();
            const daysAgo = Math.floor(Math.random() * 14) + 1;
            const d = new Date(now);
            d.setDate(d.getDate() - daysAgo);
            d.setHours(Math.floor(Math.random() * 12) + 6, Math.floor(Math.random() * 60), 0, 0);
            return d;
        }

        function formatTime(date) {
            const now = new Date();
            const diff = (now - date) / 1000;
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            if (diff < 172800) return 'Yesterday';
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function formatFullDate(date) {
            return date.toLocaleString([], {
                month: 'long',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        const MOCK_CAPTIONS = [
            'Kurova Guva ceremony completed for Sekuru last weekend. His spirit rests with the ancestors. 🕊️',
            'Learning traditional brewing from Ambuya. Mahewu recipe passed down five generations. 🥛',
            'Beautiful family gathering in Masvingo. So much joy and laughter! 🌿',
            'Just discovered our chidawo — Mutumwa. Proud to carry this heritage forward.',
            'Visited the sacred muhacha tree today. Felt the presence of our vadzimu.',
            'Nhimbe season! The whole village came together to harvest. Mushandirapamwe!',
            'My grandmother\'s wisdom: "Mwana asingachemi anofira mumbereko." Speak up, always.',
            'Roora negotiations underway! Exciting times for our family. 💍',
            'Exploring our lineage map — so many connections across Zimbabwe. 🌍',
            'Traditional mbira music night under the stars. The ancestors were with us.',
        ];

        function generateMockPosts(count = 12) {
            const posts = [];
            const mediaTypes = ['image', 'image', 'image', 'video', 'image', 'image'];
            const colors = ['#D4A373', '#A3B18A', '#D6CCC2', '#CCD5AE', '#E9EDC9', '#FEFAE0', '#FAEDCD', '#F8EDE3', '#E3D5CA',
                '#D5BDAF'
            ];

            for (let i = 0; i < count; i++) {
                const user = randomUser();
                const date = randomDate();
                const isVideo = mediaTypes[i % mediaTypes.length] === 'video';
                const color = colors[i % colors.length];
                const likes = Math.floor(Math.random() * 42) + 3;
                const liked = Math.random() > 0.7;

                posts.push({
                    id: state.nextId++,
                    userId: user.name,
                    userName: user.name,
                    userInitials: user.initials,
                    userColor: user.color,
                    caption: MOCK_CAPTIONS[i % MOCK_CAPTIONS.length],
                    timestamp: date,
                    timeAgo: formatTime(date),
                    fullDate: formatFullDate(date),
                    likes: likes,
                    likedByMe: liked,
                    mediaType: isVideo ? 'video' : 'image',
                    mediaColor: color,
                    isVideo: isVideo,
                    comments: Math.floor(Math.random() * 8),
                    shares: Math.floor(Math.random() * 6),
                });
            }
            // sort by newest first
            posts.sort((a, b) => b.timestamp - a.timestamp);
            return posts;
        }

        // ─── INIT ──────────────────────────────────────────────────────
        function init() {
            state.posts = generateMockPosts(10);
            renderStories();
            renderFeed();
        }

        // ─── RENDER STORIES ────────────────────────────────────────────
        function renderStories() {
            // Keep the "Add Story" item, add 5 more
            const existing = storyRail.querySelector('.story-item');
            storyRail.innerHTML = '';
            storyRail.appendChild(existing);

            const storyUsers = MOCK_USERS.slice(0, 5);
            storyUsers.forEach((user, idx) => {
                const item = document.createElement('div');
                item.className = 'story-item';
                item.onclick = () => showToast(`📖 ${user.name}'s story`);
                item.innerHTML = `
                    <div class="story-ring"><div class="avatar" style="background:${user.color}; color:#fff;">${user.initials}</div></div>
                    <span class="label">${user.name.split(' ')[0]}</span>
                `;
                storyRail.appendChild(item);
            });
        }

        // ─── RENDER FEED ───────────────────────────────────────────────
        function renderFeed() {
            if (!state.posts.length) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <h3>No posts yet</h3>
                        <p>Share your first family memory, story, or heritage moment.</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = '';
            state.posts.forEach(post => {
                const card = createPostCard(post);
                feed.appendChild(card);
            });
        }

        // ─── CREATE POST CARD ──────────────────────────────────────────
        function createPostCard(post) {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.dataset.id = post.id;

            const likedClass = post.likedByMe ? 'liked' : '';
            const likeIcon = post.likedByMe ? '❤️' : '🤍';

            // Media content
            let mediaContent = '';
            const mediaBg = post.mediaColor || '#D9D9D9';

            if (post.mediaType === 'video') {
                mediaContent = `
                    <video src="#" poster="" style="background:${mediaBg};" muted playsinline></video>
                    <div class="play-icon">▶</div>
                `;
            } else {
                mediaContent = `
                    <div style="width:100%;height:100%;background:${mediaBg};display:flex;align-items:center;justify-content:center;font-size:3rem;color:rgba(255,255,255,0.6);">
                        📷
                    </div>
                `;
            }

            // Build the card
            card.innerHTML = `
                <!-- Media (tap to expand) -->
                <div class="post-media" data-postid="${post.id}">
                    ${mediaContent}
                </div>

                <!-- Collapsible body -->
                <div class="post-body" id="body-${post.id}">
                    <!-- Header -->
                    <div class="post-header">
                        <div class="avatar-sm" style="background:${post.userColor || '#E9F0EC'}; color:#fff;">
                            ${post.userInitials}
                        </div>
                        <div class="meta">
                            <div class="name">
                                ${post.userName}
                                <span class="badge">${post.userName.includes('Moyo') ? '🌿' : '🪶'}</span>
                            </div>
                            <div class="time">${post.fullDate}</div>
                        </div>
                    </div>

                    <!-- Caption -->
                    <div class="post-caption">${post.caption}</div>

                    <!-- Actions -->
                    <div class="post-actions">
                        <div class="left">
                            <button class="action-btn ${likedClass}" data-action="like" data-postid="${post.id}">
                                <span class="icon">${likeIcon}</span>
                                <span class="count">${post.likes}</span>
                            </button>
                            <button class="action-btn" data-action="share" data-postid="${post.id}">
                                <span class="icon">💬</span>
                                <span class="count">${post.comments || 0}</span>
                            </button>
                            <button class="action-btn share-btn" data-action="whatsapp" data-postid="${post.id}">
                                <span class="icon">📲</span>
                            </button>
                        </div>
                        <div class="right">
                            <span class="post-meta-tag">${post.isVideo ? '📹' : '🖼️'} · ${post.shares || 0} shares</span>
                        </div>
                    </div>
                </div>
            `;

            // ─── Event: tap media to toggle body ──────────────────────
            const media = card.querySelector('.post-media');
            const body = card.querySelector('.post-body');

            media.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = body.classList.contains('open');
                // Close all others
                document.querySelectorAll('.post-body.open').forEach(el => {
                    if (el.id !== body.id) el.classList.remove('open');
                });
                body.classList.toggle('open');
                // If opening, scroll into view smoothly
                if (!isOpen) {
                    setTimeout(() => {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 100);
                }
            });

            // ─── Like ──────────────────────────────────────────────────
            const likeBtn = card.querySelector('[data-action="like"]');
            likeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleLike(post.id);
            });

            // ─── WhatsApp Share ────────────────────────────────────────
            const shareBtn = card.querySelector('[data-action="whatsapp"]');
            shareBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                shareOnWhatsApp(post);
            });

            // ─── Comment / share placeholder ───────────────────────────
            const commentBtn = card.querySelector('[data-action="share"]');
            commentBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                showToast('💬 Comment feature coming soon');
            });

            return card;
        }

        // ─── LIKE TOGGLE ──────────────────────────────────────────────
        function toggleLike(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            post.likedByMe = !post.likedByMe;
            post.likes += post.likedByMe ? 1 : -1;

            // Update UI
            const card = document.querySelector(`.post-card[data-id="${postId}"]`);
            if (!card) return;

            const btn = card.querySelector('[data-action="like"]');
            const icon = btn.querySelector('.icon');
            const count = btn.querySelector('.count');

            if (post.likedByMe) {
                btn.classList.add('liked');
                icon.textContent = '❤️';
            } else {
                btn.classList.remove('liked');
                icon.textContent = '🤍';
            }
            count.textContent = post.likes;

            showToast(post.likedByMe ? '❤️ Liked!' : '💔 Unliked');
        }

        // ─── WHATSAPP SHARE ──────────────────────────────────────────
        function shareOnWhatsApp(post) {
            const text = encodeURIComponent(
                `🌿 *${post.userName}* shared on Roots:\n\n“${post.caption}”\n\nJoin me on Roots — preserve our family heritage!`
            );
            const url = `https://wa.me/?text=${text}`;
            window.open(url, '_blank');
            showToast('📲 Opening WhatsApp...');
        }

        // ─── COMPOSE (via keyboard shortcut 'C') ─────────────────────
        function openCompose() {
            const caption = prompt('📝 Share a family memory or heritage moment:');
            if (!caption || caption.trim() === '') return;

            const user = MOCK_USERS[0]; // "you" as the author
            const newPost = {
                id: state.nextId++,
                userId: user.name,
                userName: user.name,
                userInitials: user.initials,
                userColor: user.color,
                caption: caption.trim(),
                timestamp: new Date(),
                timeAgo: 'Just now',
                fullDate: formatFullDate(new Date()),
                likes: 0,
                likedByMe: false,
                mediaType: 'image',
                mediaColor: '#D4A373',
                isVideo: false,
                comments: 0,
                shares: 0,
            };

            state.posts.unshift(newPost);
            renderFeed();

            // Auto-expand the new post
            setTimeout(() => {
                const card = document.querySelector(`.post-card[data-id="${newPost.id}"]`);
                if (card) {
                    const body = card.querySelector('.post-body');
                    body.classList.add('open');
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 200);

            showToast('✅ Post published!');
        }

        // ─── KEYBOARD SHORTCUT: C to compose ──────────────────────────
        document.addEventListener('keydown', (e) => {
            if ((e.key === 'c' || e.key === 'C') && !e.ctrlKey && !e.metaKey && !e.target.closest('input,textarea')) {
                e.preventDefault();
                openCompose();
            }
        });

        // ─── START ─────────────────────────────────────────────────────
        init();

        // Expose for debugging / global use
        window.__roots = { state, renderFeed, showToast, openCompose };
    </script>

</body>
</html>
