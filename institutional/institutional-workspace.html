<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Roots — Institutional Workspace</title>
  <meta name="theme-color" content="#0d2b4e">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="institutional-workspace.css">
</head>
<body>
  <div class="ws-app">
    <!-- Sidebar navigation (desktop) -->
    <aside class="ws-sidebar" id="wsSidebar">
      <div style="padding:4px 10px 14px;">
        <div class="ws-brand" style="color:#0d2b4e;">ROOTS</div>
        <p class="sub">Institutional Workspace</p>
      </div>
      <nav id="wsNav" aria-label="Workspace sections"></nav>
    </aside>

    <!-- Main column -->
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
      <header class="ws-topbar">
        <button class="ws-menu-btn" id="wsMenuBtn" aria-label="Menu">☰</button>
        <span class="ws-brand">ROOTS</span>
        <div class="ws-org">
          <h1 id="wsOrgTitle">Institution</h1>
          <p id="wsOrgType">Workspace</p>
        </div>
        <span class="chip" id="wsScopeChip">Scope</span>
        <span class="chip ok" id="wsPlanChip">Plan</span>
        <span id="wsSyncChip"></span>
        <div class="ws-userchip" id="wsUserChip"></div>
        <button id="wsBell" aria-label="Notifications">🔔<span id="wsBellCount">0</span></button>
        <button id="wsSignOut">SIGN OUT</button>
        <div id="wsNotifPop" role="menu"></div>
      </header>

      <div class="ws-provisional" id="wsProvisional" style="display:none;"></div>

      <main class="ws-main" id="wsView" aria-live="polite"></main>
    </div>
  </div>

  <!-- Mobile bottom navigation -->
  <nav id="wsBottomNav" aria-label="Quick navigation"></nav>

  <div id="wsToast" role="status"></div>

  <!-- Shared data infrastructure (order matters: store before dataset) -->
  <script src="../store.js"></script>
  <script src="../data.js"></script>
  <script src="../zw_locations.js"></script>
  <script src="../dataset_v2.js"></script>
  <script src="../dataset.js"></script>
  <script src="../lookups.js"></script>
  <script src="../customary.js"></script>
  <script src="../schools_db.js"></script>
  <!-- Institutional layer -->
  <script src="institutional-config.js"></script>
  <script src="institutional-workspace-config.js"></script>
  <script src="institutional-access.js"></script>
  <!-- View modules (register themselves, order-independent) -->
  <script src="institutional-dashboard.js"></script>
  <script src="institutional-search.js"></script>
  <script src="institutional-lineage.js"></script>
  <script src="institutional-projects.js"></script>
  <script src="institutional-reports.js"></script>
  <script src="institutional-exports.js"></script>
  <script src="institutional-disputes.js"></script>
  <script src="institutional-access-centre.js"></script>
  <script src="institutional-organisation.js"></script>
  <!-- Shell boots last -->
  <script src="institutional-shell.js"></script>
</body>
</html>
