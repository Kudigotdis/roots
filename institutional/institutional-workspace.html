<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#003366">
<title>Roots — Institutional Workspace</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="institutional.css">
</head>
<body class="institutional-root workspace-scope">

<div id="institutional-app" class="screen active">
  <div class="inst-topbar">
    <div class="inst-eyebrow">Roots · Research Portal</div>
    <div class="inst-title">🏛️ Institutional Dashboard</div>
    <div class="inst-userchip" id="instUserChip"></div>
  </div>
  <div class="inst-body" id="instBody">
    <div class="inst-provisional" id="instProvisional"></div>
    <div class="inst-stats" id="instStats"></div>
    <div class="inst-view-toggles">
      <button class="inst-view-toggle active" data-view="profiles">👤 Profiles</button>
      <button class="inst-view-toggle" data-view="totems">📜 Totem Directory</button>
      <button class="inst-view-toggle" data-view="auditor">🔍 Lineage Auditor</button>
      <button class="inst-view-toggle" data-view="dispute">⚖️ Dispute Queue</button>
    </div>
    <div class="inst-search">
      <span class="inst-search-icon">🔍</span>
      <input type="text" id="instSearch" placeholder="Search name, totem, chidawo…">
    </div>
    <div class="inst-filter-row" id="instFilters"></div>
    <div id="instTotemList"></div>
    <div id="instAuditor" style="display:none;"></div>
    <div id="instDispute" style="display:none;"></div>
    <div class="inst-export-row" id="instExportRow">
      <select id="instExportFormat" style="background:#fff;color:#16202c;border:1px solid #ccd3dd;border-radius:6px;padding:4px 8px;font-size:0.78rem;">
        <option value="json">JSON</option>
        <option value="csv">CSV</option>
        <option value="ead3">ISAD(G) / EAD3 XML</option>
      </select>
      <button class="btn-export" id="instExport">📤 Export</button>
    </div>
    <div class="inst-sessionbar">
      <button class="inst-signout" id="instSignOut">Sign out</button>
    </div>
  </div>
</div>

<!-- PROFILE DETAIL OVERLAY -->
<div class="inst-modal-overlay" id="instProfileOverlay" role="dialog" aria-modal="true">
  <div class="inst-modal inst-panel" style="max-width:420px;">
    <h3 id="instProfileName" style="margin-bottom:2px;">—</h3>
    <div style="font-size:12px;color:#5f6b7c;margin-bottom:12px;" id="instProfileSub"></div>
    <div id="instProfileBody" style="font-size:13px;"></div>
    <div class="inst-modal-actions" style="margin-top:14px;">
      <button type="button" class="inst-btn inst-btn-ghost" id="instProfileClose">Close</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="../data.js"></script>
<script src="../lookups.js"></script>
<script src="../customary.js"></script>
<script src="../shell.js"></script>
<script src="../store.js"></script>
<script src="../dataset_v2.js"></script>
<script src="../dataset.js"></script>
<script src="institutional-config.js"></script>
<script src="institutional-workspace.js"></script>
</body>
</html>
